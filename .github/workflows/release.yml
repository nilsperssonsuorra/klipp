name: Release

# Push a tag like v1.0.1 (matching klipp/__init__.py) to build Klipp.exe and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: python -m pyflakes klipp tests tools

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (python -c "import klipp; print(klipp.__version__)").Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match klipp.__version__ ($version)" }

      - name: Build
        shell: pwsh
        env:
          KLIPP_PYTHON: python
          QT_QPA_PLATFORM: offscreen  # only affects the icon export during the build
        run: ./build.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: klipp-windows
          path: dist/Klipp-*-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Klipp-*-windows.zip
          generate_release_notes: true
          body: |
            **Download** the `Klipp-…-windows.zip` file below, unzip it anywhere and run `Klipp.exe`.

            Klipp isn't code-signed yet, so Windows SmartScreen may warn the first time. Click **More info → Run anyway**.
